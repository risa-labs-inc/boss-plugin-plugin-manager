name: Tests

# build.yml only triggers on `push: main` and workflow_dispatch, so until this existed
# ./gradlew test never ran on a pull request: the organisation call-to-action shipped with
# 379 lines of tests that were advisory rather than load-bearing, and a reviewer had to take
# "green locally" on trust.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Selects the downloaded-jar branch in build.gradle.kts rather than the sibling
      # checkout, which only exists on a developer machine.
      CI: 'true'
      # build.gradle.kts errors at CONFIGURATION time without this, so it is needed even
      # to list tasks - see the anon-key resolution at the top of that file.
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch the latest plugin api jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Latest, matching boss_plugin_api_version in build.yml — so this job compiles
          # against the same api the release job will. The api is additive-only, so latest
          # always carries the symbols this code needs.
          mkdir -p build/downloaded-deps
          # Excludes sources/thin classifiers explicitly: --output takes a single file, so a
          # release that ever ships a second matching asset would fail the job. build.gradle.kts
          # filters the same two for the same reason.
          gh release download \
            --repo risa-labs-inc/boss-plugin-api \
            --pattern 'boss-plugin-api-*[0-9].jar' \
            --output build/downloaded-deps/boss-plugin-api.jar
          test -s build/downloaded-deps/boss-plugin-api.jar

      - name: Run tests
        run: ./gradlew test --no-daemon

      # buildPluginJar carries the packaged-bytecode guards (no Compose $stable read against
      # ai.rever.boss.plugin.logging, and plugin.json stamped with the built version). They live in
      # a doLast, so without this step they first ran in the RELEASE workflow on push to main —
      # meaning the regression class they defend against reached main before anything noticed, and
      # surfaced as a red release rather than a red PR. That is how 1.2.6 and 1.2.7 shipped
      # unloadable.
      - name: Build the plugin jar (runs the packaged-bytecode guards)
        run: ./gradlew buildPluginJar --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
